---

# Overrides spécifiques à l'environnement production
db_name: devopsapp_prod
db_user: appuser_prod

mysql_databases:
  - name: devopsapp_prod
    encoding: utf8mb4
    collation: utf8mb4_general_ci

mysql_users:
  - name: appuser_prod
    host: localhost
    password: "{{ vault_mysql_app_password }}"
    priv: "devopsapp_prod.*:ALL"

app_nginx_server_name: "example.com"
