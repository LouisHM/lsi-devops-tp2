---

# Overrides spécifiques à l'environnement staging
db_name: devopsapp_staging
db_user: appuser_staging

mysql_databases:
  - name: devopsapp_staging
    encoding: utf8mb4
    collation: utf8mb4_general_ci

mysql_users:
  - name: appuser_staging
    host: localhost
    password: "{{ vault_mysql_app_password }}"
    priv: "devopsapp_staging.*:ALL"

app_nginx_server_name: "staging.example.com"
